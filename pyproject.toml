[project]
name = "upfront"
version = "0.1.0"
description = "See how many tokens your MCP servers, skills and instruction files cost a coding agent before your first prompt, and which tools break in which client."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thanatchon" }]
keywords = ["mcp", "model-context-protocol", "claude-code", "codex", "gemini-cli", "opencode", "tokens", "context-window", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3.0",
    "tiktoken>=0.14.0",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/thanatchon36/upfront"
Issues = "https://github.com/thanatchon36/upfront/issues"
Changelog = "https://github.com/thanatchon36/upfront/blob/main/CHANGELOG.md"

[project.scripts]
upfront = "upfront.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["upfront"]
branch = true

[tool.coverage.report]
show_missing = true
