name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: Command you ran and the output}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version, description: "`upfront --version`, OS, Python version"}
    validations: {required: true}
